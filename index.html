<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172d40">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Train Spotter">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Australian Train Spotter</title>
<style>
:root{--navy:#172d40;--blue:#28516c;--gold:#e4a83b;--bg:#f3f5f7;--ink:#172432;--muted:#647383;--line:#dce2e7;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
header{background:var(--navy);color:white;padding:calc(18px + env(safe-area-inset-top)) 18px 20px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:13px;background:var(--gold);display:grid;place-items:center;font-size:26px}
h1{font-size:21px;line-height:1.1;margin:0;letter-spacing:.3px}header p{margin:5px 0 0;color:#cbd8e2;font-size:12px;letter-spacing:1.1px}
main{max-width:760px;margin:auto;padding:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:15px}.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{display:block;font-size:23px}.stat span{font-size:10px;letter-spacing:.7px;color:var(--muted);font-weight:700}
.actions{display:flex;gap:9px;margin-bottom:14px}.btn{border:0;border-radius:11px;padding:12px 15px;background:var(--blue);color:white;font-weight:700;font-size:14px;cursor:pointer}.btn.gold{background:var(--gold);color:#172432}.btn.light{background:#e8eef2;color:var(--navy)}.btn.danger{background:#a73535}.actions .btn{flex:1}
.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;background:white;margin-bottom:12px}
.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 9px}.sectionhead h2{font-size:13px;letter-spacing:1px;margin:0;color:var(--muted)}
.card{background:white;border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:10px;display:flex;gap:12px;align-items:center;cursor:pointer}
.thumb{width:76px;height:68px;border-radius:10px;object-fit:cover;background:#e9eef2;display:grid;place-items:center;flex-shrink:0;font-size:25px;color:#789}
.cardinfo{min-width:0;flex:1}.cardinfo b{font-size:18px}.cardinfo p{margin:4px 0;color:var(--muted);font-size:13px}.count{font-size:12px;color:var(--muted)}
.empty{background:white;border:1px dashed #bbc7d0;border-radius:15px;padding:28px 18px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:6px}
.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:12px}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 5px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font:16px inherit;background:white;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none!important}
.back{border:0;background:none;color:var(--blue);font-weight:700;padding:8px 0 14px;font-size:15px}
.detailtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.detailtop h2{margin:0;font-size:27px}.muted{color:var(--muted);font-size:13px}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.photo{position:relative}.photo img{width:100%;height:145px;object-fit:cover;border-radius:11px;background:#e8eef2}.photo small{display:block;color:var(--muted);padding:4px}
.sighting{padding:11px 0;border-top:1px solid var(--line)}.sighting b{display:block;font-size:14px}.sighting span{font-size:13px;color:var(--muted)}
footer{text-align:center;color:#83909b;font-size:11px;padding:20px}
.notice{background:#fff7e7;border:1px solid #f1d59c;border-radius:12px;padding:12px;font-size:13px;color:#654a19;margin-bottom:12px}
@media(min-width:600px){.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">🚆</div><div><h1>AUSTRALIAN TRAIN SPOTTER</h1><p>YOUR PERSONAL RAILWAY PHOTO LOG</p></div></div></header>
<main>
<section id="home">
  <div class="stats">
    <div class="stat"><b id="statLocos">0</b><span>LOCOMOTIVES</span></div>
    <div class="stat"><b id="statPhotos">0</b><span>PHOTOS</span></div>
    <div class="stat"><b id="statSightings">0</b><span>SIGHTINGS</span></div>
  </div>
  <div class="actions"><button class="btn gold" id="addBtn">＋ Add locomotive</button><button class="btn light" id="backupBtn">⇧ Backup</button></div>
  <input class="search" id="search" placeholder="Search number, class or operator…" autocomplete="off">
  <div class="sectionhead"><h2>MY LOCOMOTIVES</h2><span class="muted" id="resultCount"></span></div>
  <div id="list"></div>
</section>

<section id="formView" class="hidden">
  <button class="back" data-home>‹ Back to collection</button>
  <div class="panel"><h2 id="formTitle">Add locomotive</h2>
    <label for="number">CAB / UNIT NUMBER *</label><input id="number" placeholder="e.g. NR84" autocapitalize="characters">
    <div class="row"><div><label for="className">CLASS</label><input id="className" placeholder="e.g. NR, 81, XPT"></div><div><label for="state">STATE / TERRITORY</label><select id="state"><option>NSW</option><option>VIC</option><option>QLD</option><option>SA</option><option>WA</option><option>TAS</option><option>NT</option><option>ACT</option><option>National / interstate</option></select></div></div>
    <label for="operator">OPERATOR</label><input id="operator" placeholder="e.g. Pacific National">
    <label for="notes">NOTES</label><textarea id="notes" placeholder="Livery, name, details…"></textarea>
    <button class="btn" style="width:100%;margin-top:15px" id="saveLoco">Save locomotive</button>
  </div>
</section>

<section id="detailView" class="hidden">
  <button class="back" data-home>‹ Back to collection</button>
  <div class="panel">
    <div class="detailtop"><div><h2 id="detailNumber"></h2><p class="muted" id="detailMeta"></p></div><button class="btn light" id="editBtn">Edit</button></div>
    <p id="detailNotes" class="muted"></p>
  </div>
  <div class="panel"><div class="sectionhead"><h2>PHOTOGRAPHS</h2><span class="muted" id="photoCount"></span></div>
    <input type="file" id="photoInput" accept="image/*" multiple capture="environment">
    <p class="muted">Choose one or more photos. On iPhone you can use the camera or photo library.</p>
    <div class="gallery" id="gallery"></div>
  </div>
  <div class="panel"><div class="sectionhead"><h2>SIGHTING HISTORY</h2></div>
    <label for="sightingDate">DATE AND TIME</label><input type="datetime-local" id="sightingDate">
    <label for="sightingLocation">LOCATION / STATION / LINE</label><input id="sightingLocation" placeholder="e.g. Broadmeadow">
    <label for="sightingNotes">NOTES</label><input id="sightingNotes" placeholder="Working, direction, consist…">
    <button class="btn" style="width:100%;margin-top:12px" id="addSighting">＋ Record sighting</button>
    <div id="sightingList" style="margin-top:12px"></div>
  </div>
  <button class="btn danger" id="deleteLoco" style="width:100%">Delete this locomotive</button>
</section>
<footer>Australian Train Spotter · Personal collection prototype</footer>
</main>
<script>
const DB='AustralianTrainSpotterDB', STORE='records';
let db, records=[], activeId=null, editingId=null;
const $=id=>document.getElementById(id);
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function allRecords(){return new Promise((resolve,reject)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function saveRecord(item){return new Promise((resolve,reject)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(item);t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}
function deleteRecord(id){return new Promise((resolve,reject)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(id);t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}
function show(id){['home','formView','detailView'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');window.scrollTo(0,0)}
function escapeHTML(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function refresh(){records=await allRecords();$('statLocos').textContent=records.length;$('statPhotos').textContent=records.reduce((n,r)=>n+r.photos.length,0);$('statSightings').textContent=records.reduce((n,r)=>n+r.sightings.length,0);renderList()}
function renderList(){const q=$('search').value.toLowerCase();const arr=records.filter(r=>[r.number,r.className,r.operator,r.state].join(' ').toLowerCase().includes(q)).sort((a,b)=>a.number.localeCompare(b.number));$('resultCount').textContent=arr.length+' records';$('list').innerHTML=arr.length?arr.map(r=>`<div class="card" data-open="${r.id}">${r.photos[0]?`<img class="thumb" src="${r.photos[0].data}" alt="">`:'<div class="thumb">🚆</div>'}<div class="cardinfo"><b>${escapeHTML(r.number)}</b><p>${escapeHTML([r.className,r.operator,r.state].filter(Boolean).join(' · '))}</p><span class="count">${r.photos.length} photos · ${r.sightings.length} sightings</span></div><span>›</span></div>`).join(''):'<div class="empty"><strong>No locomotives yet</strong>Add your first cab or unit number to start your Australian train collection.</div>';document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openDetail(el.dataset.open))}
function blankForm(){editingId=null;$('formTitle').textContent='Add locomotive';['number','className','operator','notes'].forEach(x=>$(x).value='');$('state').value='NSW'}
function openForm(id=null){blankForm();if(id){const r=records.find(x=>x.id===id);editingId=id;$('formTitle').textContent='Edit locomotive';$('number').value=r.number;$('className').value=r.className;$('operator').value=r.operator;$('state').value=r.state;$('notes').value=r.notes}show('formView')}
async function openDetail(id){activeId=id;const r=records.find(x=>x.id===id);if(!r)return;$('detailNumber').textContent=r.number;$('detailMeta').textContent=[r.className,r.operator,r.state].filter(Boolean).join(' · ');$('detailNotes').textContent=r.notes;$('photoCount').textContent=r.photos.length+' photos';$('gallery').innerHTML=r.photos.map((p,i)=>`<div class="photo"><img src="${p.data}" alt="Photo of ${escapeHTML(r.number)}"><small>${escapeHTML(p.caption||new Date(p.date).toLocaleDateString())}</small><button class="btn danger" data-delphoto="${i}" style="padding:6px 9px;font-size:11px">Delete</button></div>`).join('');document.querySelectorAll('[data-delphoto]').forEach(b=>b.onclick=async e=>{e.stopPropagation();if(confirm('Delete this photo?')){r.photos.splice(+b.dataset.delphoto,1);await saveRecord(r);await refresh();openDetail(id)}});$('sightingList').innerHTML=r.sightings.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(s=>`<div class="sighting"><b>${new Date(s.date).toLocaleString()}</b><span>${escapeHTML(s.location)}${s.notes?' · '+escapeHTML(s.notes):''}</span></div>`).join('')||'<p class="muted">No sightings recorded yet.</p>';$('sightingDate').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);$('sightingLocation').value='';$('sightingNotes').value='';show('detailView')}
$('addBtn').onclick=()=>openForm();$('search').oninput=renderList;$('saveLoco').onclick=async()=>{const number=$('number').value.trim().toUpperCase();if(!number){alert('Please enter a cab or unit number.');return}const duplicate=records.find(r=>r.number===number&&r.id!==editingId);if(duplicate){alert('That number is already in your collection. Open the existing record instead.');return}const old=records.find(r=>r.id===editingId);const item={id:editingId||crypto.randomUUID(),number,className:$('className').value.trim(),operator:$('operator').value.trim(),state:$('state').value,notes:$('notes').value.trim(),photos:old?.photos||[],sightings:old?.sightings||[]};await saveRecord(item);await refresh();show('home')};
$('editBtn').onclick=()=>openForm(activeId);
$('photoInput').onchange=async e=>{const r=records.find(x=>x.id===activeId);for(const file of [...e.target.files]){if(!file.type.startsWith('image/'))continue;const data=await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(file)});r.photos.push({data,date:new Date().toISOString(),caption:file.name})}await saveRecord(r);await refresh();openDetail(activeId);e.target.value=''};
$('addSighting').onclick=async()=>{const r=records.find(x=>x.id===activeId);if(!$('sightingDate').value){alert('Choose a date and time.');return}r.sightings.push({date:new Date($('sightingDate').value).toISOString(),location:$('sightingLocation').value.trim(),notes:$('sightingNotes').value.trim()});await saveRecord(r);await refresh();openDetail(activeId)};
$('deleteLoco').onclick=async()=>{if(confirm('Delete this locomotive and all its photos and sightings? This cannot be undone.')){await deleteRecord(activeId);await refresh();show('home')}};
document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>show('home'));
$('backupBtn').onclick=async()=>{const data=JSON.stringify({app:'Australian Train Spotter',version:1,exportedAt:new Date().toISOString(),records:await allRecords()});const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Australian-Train-Spotter-backup.json';a.click();URL.revokeObjectURL(url)};
(async()=>{try{db=await openDB();await refresh();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){alert('Your browser could not open local storage. Please use Safari on iPhone.')}})();
</script>
</body></html>
